[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prosecution-data"
version = "0.1.0"
description = "Reproducible USPTO prosecution data acquisition pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=17",
  "pypdf>=5",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "reportlab>=4",
]

[project.scripts]
prosecution-data = "prosecution_data.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prosecution_data = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in tests that contact USPTO"]
